[package]
name = "zoka"
version = "3.0.4"
edition = "2021"
autobins = false

description = "Proof-of-work blockchain with zero-knowledge proof infrastructure in Rust."

[[bin]]
name = "zoka"
path = "src/main.rs"

[[bin]]
name = "zokahd"
path = "src/bin/zokahd.rs"

[lib]
name = "zoka"
path = "src/lib.rs"

# Mide el escaneo de salidas v1 y v2 (etapa 3). Solo existe con la feature
# experimental; sin ella Cargo lo saltea en vez de fallar.
[[example]]
name = "hybrid_scan_bench"
required-features = ["pq-experimental"]

[[example]]
name = "probar_motor_quantic"
required-features = ["quantic"]

[features]
# `randomx` is on by default so a stock `cargo build --release` produces a
# binary that can actually mine mainnet. Disable explicitly with
# `--no-default-features` for CI environments without the RandomX toolchain.
default = ["randomx"]
# Enables the RandomX PoW backend used by public ZOKA network binaries.
# Pulls in the `randomx-rs` crate which links to the official RandomX
# C++ library; public testnet binaries should be built with this feature.
# Build prerequisites:
#   - Linux x86_64: gcc/clang, cmake >= 3.5, make, pkg-config
#   - Windows x86_64: Visual Studio Build Tools (MSVC v143+) and cmake on PATH
# See docs/protocol-overview.md for the network summary.
randomx = ["dep:randomx-rs", "dep:sysinfo"]
# Enabled by the Android native crate (zkapriv/native). It marks the build as
# the on-device prover so trusted-setup params are read WITHOUT the per-point
# subgroup-membership check: on mobile the params come from the app's own APK
# assets and their SHA digest is already verified against the canonical CRS
# before loading, so re-checking the subgroup is redundant and just burns
# minutes on a phone. Node/server builds never enable this, so they keep the
# full check. See src/zk/setup_io.rs::read_circuit_params.
mobile = []
# Primitivas postcuanticas experimentales de Zoka Quantic (crates/zoka-pq).
# Apagada por defecto: compilarla no cambia consenso, direcciones ni wallets,
# y el .so de la wallet movil (que usa `mobile` sin default features) no la
# arrastra. Solo expone `zoka::pq` para pruebas y trabajo de integracion.
pq-experimental = ["dep:zoka-pq", "dep:rustls"]
# Zoka Quantic (etapa 5): perfil de red `quantic-testnet` con el circuito de
# Ironwood (crate orchard) y el cifrado de notas X-Wing (crates/zoka-quantic).
# Arrastra orchard y Halo 2. Implica pq-experimental (firmas hibridas de la
# etapa 6, que Quantic exige desde el genesis). Zenith no cambia con ella.
quantic = ["pq-experimental", "dep:zoka-quantic", "dep:num-bigint"]
# STARK consensus and wallet integration on a separate local v2 chain.
quantic-pq = ["quantic", "dep:zoka-pq-pool", "dep:postcard"]

[dependencies]
randomx-rs = { version = "1.3", optional = true }
# Cross-platform free-RAM detection for RandomX full/light mode selection
# (src/mining/pow.rs::free_ram_bytes). Only needed by the randomx module.
sysinfo = { version = "0.32", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Compresion para los resumenes de bloque que consume la wallet movil. Backend
# puro Rust a proposito: el .so de Android se compila de forma cruzada para
# armeabi-v7a y meter una biblioteca en C ahi es pedir problemas que no se ven
# hasta que fallan en el telefono.
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
tokio = { version = "1", features = ["full"] }
tokio-socks = "0.5"
libp2p = { version = "0.57", features = ["tokio", "noise", "yamux", "tcp", "kad", "identify", "gossipsub", "request-response", "macros", "dns", "ping"] }
# Modern P2P layer (n0/IPFS): QUIC + built-in NAT hole-punching (direct
# connections with no open ports and no Tor) plus verified, resumable blob
# transfer for snapshot bootstrap. Added alongside libp2p during the
# transport evolution; the two coexist (Cargo resolves separate quinn/rustls
# versions) so Tor-onion stays available as a fallback path.
iroh = "1"
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
rand = "0.8"
rand_chacha = "0.3"
thiserror = "1.0"
bellman = "0.14"
pasta_curves = "0.5"
bls12_381 = "0.8"
rocksdb = "0.21"
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors"] }
ed25519-dalek = "2.0"
curve25519-dalek = "4.1"
bulletproofs = "5.0"
merlin = "3"
blake3 = "1.5"
argon2 = "0.5"
base64 = "0.21"
hex = "0.4"
aes-gcm = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1.8"
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
bytes = "1.5"
async-trait = "0.1"
home = "0.5"
clap = { version = "4.4", features = ["derive"] }
toml = "0.8"
bip39 = "2"
bs58 = "0.5"
# Bloqueo advisory de archivos entre procesos. ZSilent lanza `zoka tx-send`
# como proceso aparte mientras el nodo corre: los dos escriben los mismos
# archivos de wallet, y sin lock el nodo pisa las reservas del envio. Se
# prefiere fs4 sobre una implementacion propia porque el sistema operativo
# libera el lock si un proceso muere; un lockfile casero se queda trabado.
fs4 = "0.8"
# Ver la feature `pq-experimental`. Tiene su propio Cargo.lock para compilarse
# suelta en el telefono; dentro del nodo manda el Cargo.lock de la raiz.
zoka-pq = { path = "crates/zoka-pq", optional = true }
# El TLS híbrido postcuántico de iroh (src/network/pq_tls.rs): la misma rustls
# que ya trae iroh, con el proveedor de ring.
rustls = { version = "0.23.46", optional = true, default-features = false, features = ["ring", "std"] }
# Ver la feature `quantic`. Tiene su propio Cargo.lock para compilarse suelta;
# dentro del nodo manda el Cargo.lock de la raiz.
zoka-quantic = { path = "crates/zoka-quantic", optional = true }
zoka-pq-pool = { path = "crates/zoka-pq-pool", optional = true }
postcard = { version = "1", features = ["alloc"], optional = true }
# Objetivos de 256 bits de la dificultad de Quantic (ASERT).
num-bigint = { version = "0.4", optional = true }

[dev-dependencies]
proptest = "1.0"
tempfile = "3"

# Los datos de versión de zoka.exe y zokahd.exe en Windows (ver build.rs).
[build-dependencies]
embed-resource = "3.0.12"

# ----------------------------------------------------------------------------
# Test/dev profile speedups for crypto-heavy crates.
#
# `cargo test` runs in debug mode by default. Curve25519 / Bulletproofs /
# bellman / argon2 are ~50-100x slower in debug than release. Tests that
# stress them (clsag ring sizes 2..=16, range proofs, MPC ceremony,
# wallet KDF) end up taking minutes per run for no consensus reason.
#
# We compile only those crates at -O3 even in dev/test, so the rest of
# the repo stays in fast-compile debug. First test run pays a one-time
# recompile of these deps; every subsequent run is dramatically faster.
# Output bytes from these crates are independent of opt-level, so this
# never changes test verdicts; only their speed.
# ----------------------------------------------------------------------------
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.bulletproofs]
opt-level = 3

[profile.dev.package.bls12_381]
opt-level = 3

[profile.dev.package.bellman]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.subtle]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.sha3]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.aes-gcm]
opt-level = 3

[profile.dev.package.merlin]
opt-level = 3

[profile.dev.package.pasta_curves]
opt-level = 3

# Zoka Quantic (feature `quantic`): sin optimizar, una prueba Halo 2 tarda
# minutos y las pruebas del nodo que arman bloques serian inusables.
[profile.dev.package.halo2_proofs]
opt-level = 3

[profile.dev.package.halo2_gadgets]
opt-level = 3

[profile.dev.package.halo2_poseidon]
opt-level = 3

[profile.dev.package.orchard]
opt-level = 3

[profile.dev.package.ff]
opt-level = 3

[profile.dev.package.group]
opt-level = 3

[profile.dev.package.blake2b_simd]
opt-level = 3

[profile.dev.package.reddsa]
opt-level = 3

[profile.dev.package.ml-kem]
opt-level = 3

[profile.dev.package.ml-dsa]
opt-level = 3

[profile.dev.package.x-wing]
opt-level = 3
