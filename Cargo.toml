[package]
name = "zoka"
version = "0.1.0"
edition = "2021"

description = "100% private blockchain with Zero-Knowledge proofs (zk) in Rust."

[[bin]]
name = "zoka"
path = "src/main.rs"

[lib]
name = "zoka"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
libp2p = { version = "0.53", features = ["tokio", "noise", "yamux", "tcp", "kad", "identify", "gossipsub", "macros"] }
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
rand = "0.8"
thiserror = "1.0"
bellman = "0.14"
pasta_curves = "0.5"
rocksdb = "0.21"
axum = "0.7"
tower = "0.4"
tower-http = "0.5"
ed25519-dalek = "2.0"
blake3 = "1.5"
argon2 = "0.5"
base64 = "0.21"
hex = "0.4"
aes-gcm = "0.10"
zeroize = "1.8"
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
bytes = "1.5"
async-trait = "0.1"
home = "0.5"
clap = { version = "4.4", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
proptest = "1.0"

