[package]
name = "zoka-pq"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Experimental isolated post-quantum primitives and benchmarks for Zoka Quantic"

[dependencies]
ml-kem = { version = "=0.3.2", default-features = false, features = ["alloc", "getrandom", "zeroize"] }
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc", "getrandom", "zeroize"] }
x-wing = { version = "=0.1.1", default-features = false, features = ["getrandom", "zeroize"] }
zeroize = "=1.8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
hex = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
