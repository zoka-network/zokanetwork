[package]
name = "zoka-pq-pool"
version = "0.1.0"
edition = "2021"
publish = false
description = "Hash-based private transfers for Zoka Quantic, with hiding STARK proofs"
license = "MIT OR Apache-2.0"

[dependencies]
p3-air = "=0.8.0"
p3-challenger = "=0.8.0"
p3-commit = "=0.8.0"
p3-dft = "=0.8.0"
p3-field = "=0.8.0"
p3-fri = "=0.8.0"
p3-koala-bear = "=0.8.0"
p3-matrix = "=0.8.0"
p3-merkle-tree = "=0.8.0"
p3-poseidon2-air = "=0.8.0"
p3-symmetric = "=0.8.0"
p3-uni-stark = "=0.8.0"
rand = { version = "0.10.1", features = ["std_rng", "sys_rng"] }
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
blake2b_simd = "1"
zeroize = "1.8.2"
zoka-pq = { path = "../zoka-pq" }
chacha20poly1305 = { version = "0.11", default-features = false }
bs58 = "0.5"

[profile.release]
debug = false
