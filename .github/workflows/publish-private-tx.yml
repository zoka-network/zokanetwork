name: Publish Private TX Bodies

on:
  workflow_dispatch:
    inputs:
      tx_hash:
        description: 'TX hash to publish (leave empty to publish all pending)'
        required: false

env:
  BOOTSTRAP_IP: "159.223.119.216"
  WALLET_ADDR: "zka1EQ8Yph2MVmYGzykzQm8nUqAbngadpz2TtvH8HRw2hnjhiYofLQcavzKEs6maZgh9hS3Ffvgz6cfAqJ4jf5PFbqS5vBGLH"
  WALLET_NAME: "node-wallet-1779902862"
  DB_PATH: "/data/zoka/blockchain.db"

jobs:
  publish:
    name: Publish pending private TX bodies to local node
    runs-on: ubuntu-22.04
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_PRIVATE_KEY }}" > ~/.ssh/zoka_do
          chmod 600 ~/.ssh/zoka_do
          ssh-keyscan -H ${{ env.BOOTSTRAP_IP }} >> ~/.ssh/known_hosts

      - name: Publish private TX bodies (with retries)
        run: |
          ssh -i ~/.ssh/zoka_do root@${{ env.BOOTSTRAP_IP }} bash << 'REMOTE'
          set -e
          export ZOKA_NODE_PASSWORD="${{ secrets.ZOKA_NODE_PASSWORD }}"
          export ZOKA_HOME=/data/zoka
          export ZOKA_TRUSTED_SETUP_DIR=/opt/zoka/trusted-setup
          WALLET_FILE="${ZOKA_HOME}/.zoka/mainnet/private_wallets/${{ env.WALLET_NAME }}.json"
          SIDECAR_DIR="/data/zoka/pending_private_queue"
          mkdir -p "$SIDECAR_DIR"
          echo "=== Publishing via RPC (up to 10 attempts) ==="
          PUBLISHED=0
          for i in $(seq 1 10); do
            RESULT=$(zoka private-tx-publish \
              --network mainnet \
              --address "${{ env.WALLET_ADDR }}" \
              --rpc http://127.0.0.1:3000 \
              --password-env ZOKA_NODE_PASSWORD \
              2>&1) || true
            echo "Attempt $i: $RESULT"
            if echo "$RESULT" | grep -q "Published: [1-9]"; then
              echo "RPC publish succeeded on attempt $i"
              PUBLISHED=1
              break
            fi
            echo "Attempt $i: EAGAIN or error, waiting 15s..."
            sleep 15
          done
          echo "=== Direct sidecar write (reliable fallback) ==="
          if [ -f "$WALLET_FILE" ]; then
            PENDING_HASHES=$(jq -r '.private_transactions[].tx_hash' "$WALLET_FILE" 2>/dev/null || true)
            if [ -n "$PENDING_HASHES" ]; then
              echo "Found wallet TXs: $PENDING_HASHES"
              for TX_HASH in $PENDING_HASHES; do
                SIDECAR_FILE="${SIDECAR_DIR}/${TX_HASH}.privtx"
                if [ ! -f "$SIDECAR_FILE" ]; then
                  TX_BODY=$(jq -c --arg h "$TX_HASH" '.private_transactions[] | select(.tx_hash == $h)' "$WALLET_FILE" 2>/dev/null || true)
                  if [ -n "$TX_BODY" ]; then
                    echo "$TX_BODY" > "$SIDECAR_FILE"
                    echo "Wrote sidecar: $SIDECAR_FILE"
                  fi
                else
                  echo "Sidecar already exists: $SIDECAR_FILE"
                fi
              done
            else
              echo "No private TXs found in wallet"
            fi
          else
            echo "Wallet file not found: $WALLET_FILE"
          fi
          echo "=== Sidecar after write ==="
          ls -la "$SIDECAR_DIR" 2>/dev/null || echo "(empty or missing)"
          REMOTE

      - name: Monitor after publish
        run: |
          echo "Waiting 180s for TX to be mined (avg block time ~449s, monitoring 3 min)..."
          sleep 180
          ssh -i ~/.ssh/zoka_do root@${{ env.BOOTSTRAP_IP }} bash << 'REMOTE'
          export ZOKA_NODE_PASSWORD="${{ secrets.ZOKA_NODE_PASSWORD }}"
          export ZOKA_HOME=/data/zoka
          export ZOKA_TRUSTED_SETUP_DIR=/opt/zoka/trusted-setup
          echo "=== SIDECAR QUEUE ==="
          ls -la /data/zoka/pending_private_queue/ 2>/dev/null || echo "(empty or missing)"
          echo "=== WALLETS ==="
          zoka wallets --network mainnet --password-env ZOKA_NODE_PASSWORD 2>&1
          echo "=== NODE STATS ==="
          STATS=$(curl -s http://127.0.0.1:3000/stats)
          echo "$STATS"
          echo ""
          echo "=== BLOCKS WITH PRIVATE TXs (last 40) ==="
          HEIGHT=$(echo "$STATS" | grep -o '"height":[0-9]*' | grep -o '[0-9]*')
          HEIGHT=${HEIGHT:-0}
          END=$(( HEIGHT > 40 ? HEIGHT - 40 : 1 ))
          FOUND=0
          for H in $(seq "$HEIGHT" -1 "$END"); do
            R=$(curl -s "http://127.0.0.1:3000/blocks/$H/private_tx_hashes")
            COUNT=$(echo "$R" | grep -o '"private_tx_count":[0-9]*' | grep -o '[0-9]*' || echo "0")
            if [ "${COUNT:-0}" -gt 0 ] 2>/dev/null; then
              echo "*** Block $H HAS PRIVATE TXs: $R ***"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "(no blocks with private TXs in range $END to $HEIGHT)"
          fi
          echo "=== SCAN COMPLETE (blocks $END to $HEIGHT) ==="
          REMOTE
