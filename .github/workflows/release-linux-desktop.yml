name: Build Linux Desktop Package

# Empaqueta ZSilent Core para Linux (.deb y .rpm) y lo sube a un release ya
# existente.
#
# Existe como workflow aparte porque jpackage solo produce paquetes del sistema
# en el que corre: desde Windows no hay forma de generar un .deb. Esta es la
# unica via para que la version de Linux salga del mismo codigo y en la misma
# tanda que la de Windows.
#
# Manual, igual que release-linux-binary.yml, y sin tocar ningun droplet: se
# puede correr en cualquier momento sin arriesgar un reinicio en produccion.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag del release existente al que adjuntar los paquetes"
        required: true
      zsilent_ref:
        description: "Rama o tag de ZokaNetwork/zsilent-core a empaquetar"
        required: true
        default: "main"

permissions:
  contents: write

jobs:
  build:
    name: Build zsilent-core .deb / .rpm
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout node repo
        uses: actions/checkout@v4

      # zsilent-core es su propio repositorio y esta gitignorado por el padre,
      # asi que hay que traerlo a mano al sitio donde el build lo espera.
      - name: Checkout zsilent-core
        uses: actions/checkout@v4
        with:
          repository: ZokaNetwork/zsilent-core
          ref: ${{ inputs.zsilent_ref }}
          path: zsilent-core
          token: ${{ secrets.ZSILENT_CORE_TOKEN || github.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-desktop-

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config fakeroot rpm

      # Los mismos binarios que se empaquetan en Windows. El build de Gradle
      # falla a proposito si faltan, en vez de producir un paquete sin nodo.
      - name: Build node binaries
        run: cargo build --release --features randomx --bins

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Sin el bundle de Tor: en Windows es obligatorio porque el instalador lo
      # lleva adentro, en Linux se espera que Tor venga del sistema.
      #
      # El chmod es un cinturon: el bit de ejecucion de gradlew ya esta puesto en
      # el repositorio, pero se perdio una vez -- el repo se desarrolla en
      # Windows, donde ese permiso no existe -- y el sintoma fue un escueto
      # "Permission denied" a los diez minutos de compilar el nodo. Cuesta una
      # linea evitar volver a pagar esa espera.
      - name: Package .deb and .rpm
        working-directory: zsilent-core
        run: |
          chmod +x ./gradlew
          ./gradlew packageDeb packageRpm -Pzsilent.requireTorBundle=false --no-daemon

      - name: Collect artifacts and checksums
        run: |
          mkdir -p dist
          find zsilent-core/build/compose/binaries/main -name '*.deb' -exec cp {} dist/ \;
          find zsilent-core/build/compose/binaries/main -name '*.rpm' -exec cp {} dist/ \;
          cd dist
          sha256sum * | tee SHA256SUMS.txt
          ls -la

      - name: Upload to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" dist/* --clobber
