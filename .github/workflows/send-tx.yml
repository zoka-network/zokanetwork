name: Send Private TX

on:
  workflow_dispatch:
    inputs:
      to:
        description: 'Recipient zka1... address'
        required: true
      amount:
        description: 'Amount in ZKA'
        required: true
        default: '10'

env:
  BOOTSTRAP_IP: "159.223.119.216"

jobs:
  send:
    name: Send from treasury wallet
    runs-on: ubuntu-22.04
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_PRIVATE_KEY }}" > ~/.ssh/zoka_do
          chmod 600 ~/.ssh/zoka_do
          ssh-keyscan -H ${{ env.BOOTSTRAP_IP }} >> ~/.ssh/known_hosts

      - name: Check wallet and balance before send
        run: |
          ssh -i ~/.ssh/zoka_do root@${{ env.BOOTSTRAP_IP }} bash << 'REMOTE'
          export ZOKA_NODE_PASSWORD="${{ secrets.ZOKA_NODE_PASSWORD }}"
          export ZOKA_HOME=/data/zoka
          export ZOKA_TRUSTED_SETUP_DIR=/opt/zoka/trusted-setup
          echo "=== WALLETS ==="
          zoka wallets --network mainnet --password-env ZOKA_NODE_PASSWORD 2>&1
          echo "=== NODE STATS ==="
          curl -s http://127.0.0.1:3000/stats
          REMOTE

      - name: Send ${{ inputs.amount }} ZKA to recipient
        run: |
          ssh -i ~/.ssh/zoka_do root@${{ env.BOOTSTRAP_IP }} bash << 'REMOTE'
          set -e
          export ZOKA_NODE_PASSWORD="${{ secrets.ZOKA_NODE_PASSWORD }}"
          export ZOKA_HOME=/data/zoka
          export ZOKA_TRUSTED_SETUP_DIR=/opt/zoka/trusted-setup
          TREASURY_ADDR="zka1EQ8Yph2MVmYGzykzQm8nUqAbngadpz2TtvH8HRw2hnjhiYofLQcavzKEs6maZgh9hS3Ffvgz6cfAqJ4jf5PFbqS5vBGLH"
          # Recipient is the correct Ristretto-derived address from the user's mnemonic private keys
          RECIPIENT="${{ inputs.to }}"
          echo "Sending ${{ inputs.amount }} ZKA from treasury to $RECIPIENT"
          zoka tx-send \
            --network mainnet \
            --from "$TREASURY_ADDR" \
            --to "$RECIPIENT" \
            --amount "${{ inputs.amount }}" \
            --password-env ZOKA_NODE_PASSWORD \
            --yes \
            2>&1
          REMOTE

      - name: Publish TX body to local node mempool
        run: |
          ssh -i ~/.ssh/zoka_do root@${{ env.BOOTSTRAP_IP }} bash << 'REMOTE'
          set -e
          export ZOKA_NODE_PASSWORD="${{ secrets.ZOKA_NODE_PASSWORD }}"
          export ZOKA_HOME=/data/zoka
          export ZOKA_TRUSTED_SETUP_DIR=/opt/zoka/trusted-setup
          echo "Publishing private TX bodies to local node..."
          zoka private-tx-publish \
            --network mainnet \
            --address "zka1EQ8Yph2MVmYGzykzQm8nUqAbngadpz2TtvH8HRw2hnjhiYofLQcavzKEs6maZgh9hS3Ffvgz6cfAqJ4jf5PFbqS5vBGLH" \
            --rpc http://127.0.0.1:3000 \
            --password-env ZOKA_NODE_PASSWORD \
            2>&1 || echo "Publish completed (may have no pending bodies)"
          REMOTE

      - name: Monitor mempool and balance after send
        run: |
          echo "Waiting 20s for TX to propagate and be mined..."
          sleep 20
          ssh -i ~/.ssh/zoka_do root@${{ env.BOOTSTRAP_IP }} bash << 'REMOTE'
          export ZOKA_NODE_PASSWORD="${{ secrets.ZOKA_NODE_PASSWORD }}"
          export ZOKA_HOME=/data/zoka
          export ZOKA_TRUSTED_SETUP_DIR=/opt/zoka/trusted-setup
          echo "=== BALANCE AFTER SEND ==="
          zoka wallets --network mainnet --password-env ZOKA_NODE_PASSWORD 2>&1
          echo "=== NODE STATS ==="
          curl -s http://127.0.0.1:3000/stats
          echo "=== RECENT BLOCK PRIVATE TXs ==="
          HEIGHT=$(curl -s http://127.0.0.1:3000/stats | grep -o '"height":[0-9]*' | grep -o '[0-9]*')
          for H in $(seq $HEIGHT $(( HEIGHT - 5 )) -1 2>/dev/null || seq $HEIGHT $HEIGHT); do
            RESULT=$(curl -s http://127.0.0.1:3000/blocks/$H/private_tx_hashes 2>/dev/null)
            echo "Block $H: $RESULT"
          done
          REMOTE
