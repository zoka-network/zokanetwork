name: Node Mining Toggle

# Turns block mining on/off on a droplet by editing the systemd unit's
# ExecStart (--no-mine <-> batch mining flags) and restarting. Mines to the
# node's own wallet. Use to bootstrap a freshly-reset chain off genesis.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Node'
        required: true
        default: 'bootstrap'
        type: choice
        options:
          - bootstrap
          - rpc
      action:
        description: 'enable or disable mining'
        required: true
        default: 'enable'
        type: choice
        options:
          - enable
          - disable

env:
  BOOTSTRAP_IP: "159.223.119.216"
  RPC_IP: "157.230.5.103"

jobs:
  toggle:
    runs-on: ubuntu-22.04
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_PRIVATE_KEY }}" > ~/.ssh/zoka_do
          chmod 600 ~/.ssh/zoka_do
      - name: Toggle mining
        run: |
          if [ "${{ inputs.target }}" = "bootstrap" ]; then IP=${{ env.BOOTSTRAP_IP }}; SVC=zoka-bootstrap; else IP=${{ env.RPC_IP }}; SVC=zoka-rpc; fi
          ssh-keyscan -H $IP >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/zoka_do root@$IP "ACTION='${{ inputs.action }}' SVC=$SVC bash -s" <<'REMOTE'
          set -e
          UNIT="/etc/systemd/system/$SVC.service"
          MINE='--mine-interval-secs 12 --mine-blocks 1 --min-mine-peers 1 --power low'
          # normalise any existing mining flags back to --no-mine first
          sed -i "s|--mine-interval-secs [0-9]* --mine-blocks [0-9]* --min-mine-peers [0-9]* --power low|--no-mine|" "$UNIT"
          if [ "$ACTION" = "enable" ]; then
            sed -i "s|--no-mine|$MINE|" "$UNIT"
          fi
          grep -nE 'no-mine|mine-interval' "$UNIT" || true
          systemctl daemon-reload
          systemctl restart "$SVC"
          sleep 12
          echo "height after toggle:"; curl -fsS http://127.0.0.1:3000/chain/height || true
          REMOTE
