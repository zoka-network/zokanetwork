name: Deploy Mainnet Nodes

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target node to deploy'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - bootstrap
          - rpc

env:
  BOOTSTRAP_IP: "159.223.119.216"
  RPC_IP: "157.230.5.103"

jobs:
  build:
    name: Build Linux x86_64 binary
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install RandomX build deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential pkg-config

      - name: Build release binary
        run: cargo build --release --bin zoka

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: zoka-linux-x86_64
          path: target/release/zoka
          retention-days: 7

  deploy-bootstrap:
    name: Deploy bootstrap node
    needs: build
    runs-on: ubuntu-22.04
    if: ${{ inputs.target == 'both' || inputs.target == 'bootstrap' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: zoka-linux-x86_64
          path: ./bin/

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_PRIVATE_KEY }}" > ~/.ssh/zoka_do
          chmod 600 ~/.ssh/zoka_do
          ssh-keyscan -H ${{ env.BOOTSTRAP_IP }} >> ~/.ssh/known_hosts

      - name: Upload binary
        run: |
          ssh -i ~/.ssh/zoka_do root@${{ env.BOOTSTRAP_IP }} "systemctl stop zoka-bootstrap 2>/dev/null || true"
          chmod +x ./bin/zoka
          scp -i ~/.ssh/zoka_do ./bin/zoka root@${{ env.BOOTSTRAP_IP }}:/usr/local/bin/zoka

      - name: Upload trusted-setup
        run: |
          ssh -i ~/.ssh/zoka_do root@${{ env.BOOTSTRAP_IP }} "mkdir -p /opt/zoka/trusted-setup"
          scp -i ~/.ssh/zoka_do trusted-setup/* root@${{ env.BOOTSTRAP_IP }}:/opt/zoka/trusted-setup/

      - name: Install systemd service and start
        run: |
          ssh -i ~/.ssh/zoka_do root@${{ env.BOOTSTRAP_IP }} bash -s << 'REMOTE'
          set -e
          mkdir -p /data/zoka
          install -d -m 0700 /etc/zoka
          cat > /etc/zoka/node.env << 'EOF'
          ZOKA_NODE_PASSWORD=${{ secrets.ZOKA_NODE_PASSWORD }}
          EOF
          chmod 0600 /etc/zoka/node.env

          cat > /etc/systemd/system/zoka-bootstrap.service << 'EOF'
          [Unit]
          Description=Zoka Bootstrap Node (P2P + Mining)
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=root
          WorkingDirectory=/data/zoka
          ExecStart=/usr/local/bin/zoka fullnode \
            --network mainnet \
            --no-network-config \
            --db /data/zoka/blockchain.db \
            --listen /ip4/0.0.0.0/tcp/28080 \
            --no-mine \
            --seed /ip4/157.230.5.103/tcp/28080 \
            --sync-warmup-secs 10 \
            --sync-rebroadcast-recent-blocks 64 \
            --allow-isolated-start \
            --password-env ZOKA_NODE_PASSWORD
          EnvironmentFile=/etc/zoka/node.env
          Environment=RUST_LOG=info
          Environment=ZOKA_HOME=/data/zoka
          Environment=ZOKA_TRUSTED_SETUP_DIR=/opt/zoka/trusted-setup
          Environment=ZOKA_API_BIND=0.0.0.0:3000
          Restart=always
          RestartSec=10
          LimitNOFILE=65536
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable zoka-bootstrap
          # Stop old instance if running
          systemctl stop zoka-bootstrap 2>/dev/null || true
          systemctl start zoka-bootstrap
          sleep 8
          systemctl status zoka-bootstrap --no-pager -l
          REMOTE

      - name: Show bootstrap logs
        run: |
          ssh -i ~/.ssh/zoka_do root@${{ env.BOOTSTRAP_IP }} \
            "journalctl -u zoka-bootstrap -n 50 --no-pager"

  deploy-rpc:
    name: Deploy RPC node
    needs: [build]
    runs-on: ubuntu-22.04
    if: ${{ inputs.target == 'both' || inputs.target == 'rpc' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: zoka-linux-x86_64
          path: ./bin/

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_PRIVATE_KEY }}" > ~/.ssh/zoka_do
          chmod 600 ~/.ssh/zoka_do
          ssh-keyscan -H ${{ env.RPC_IP }} >> ~/.ssh/known_hosts

      - name: Upload binary
        run: |
          ssh -i ~/.ssh/zoka_do root@${{ env.RPC_IP }} "systemctl stop zoka-rpc 2>/dev/null || true"
          chmod +x ./bin/zoka
          scp -i ~/.ssh/zoka_do ./bin/zoka root@${{ env.RPC_IP }}:/usr/local/bin/zoka

      - name: Upload trusted-setup
        run: |
          ssh -i ~/.ssh/zoka_do root@${{ env.RPC_IP }} "mkdir -p /opt/zoka/trusted-setup"
          scp -i ~/.ssh/zoka_do trusted-setup/* root@${{ env.RPC_IP }}:/opt/zoka/trusted-setup/

      - name: Upload sync watchdog
        run: |
          scp -i ~/.ssh/zoka_do scripts/zoka-sync-watchdog.sh root@${{ env.RPC_IP }}:/usr/local/bin/zoka-sync-watchdog.sh
          scp -i ~/.ssh/zoka_do deploy/systemd/zoka-sync-watchdog.service root@${{ env.RPC_IP }}:/etc/systemd/system/zoka-sync-watchdog.service
          scp -i ~/.ssh/zoka_do deploy/systemd/zoka-sync-watchdog.timer root@${{ env.RPC_IP }}:/etc/systemd/system/zoka-sync-watchdog.timer

      - name: Install systemd service and start
        run: |
          BOOTSTRAP_IP="${{ env.BOOTSTRAP_IP }}"
          ssh -i ~/.ssh/zoka_do root@${{ env.RPC_IP }} bash -s << REMOTE
          set -e
          mkdir -p /data/zoka
          install -d -m 0700 /etc/zoka
          cat > /etc/zoka/node.env << 'EOF'
          ZOKA_NODE_PASSWORD=${{ secrets.ZOKA_NODE_PASSWORD }}
          EOF
          chmod 0600 /etc/zoka/node.env

          cat > /etc/systemd/system/zoka-rpc.service << 'EOF'
          [Unit]
          Description=Zoka RPC Node (API only, no mining)
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=root
          WorkingDirectory=/data/zoka
          ExecStart=/usr/local/bin/zoka fullnode \
            --network mainnet \
            --no-network-config \
            --db /data/zoka/blockchain.db \
            --listen /ip4/0.0.0.0/tcp/28080 \
            --no-mine \
            --seed /ip4/${BOOTSTRAP_IP}/tcp/28080 \
            --sync-warmup-secs 30 \
            --sync-rebroadcast-recent-blocks 32 \
            --allow-isolated-start \
            --password-env ZOKA_NODE_PASSWORD
          EnvironmentFile=/etc/zoka/node.env
          Environment=RUST_LOG=info
          Environment=ZOKA_HOME=/data/zoka
          Environment=ZOKA_TRUSTED_SETUP_DIR=/opt/zoka/trusted-setup
          Environment=ZOKA_API_BIND=0.0.0.0:3000
          Environment=ZOKA_API_RATE_LIMIT=1000
          Environment=ZOKA_API_TX_RATE_LIMIT=120
          Environment=ZOKA_API_MAX_BODY_BYTES=1048576
          Restart=always
          RestartSec=10
          LimitNOFILE=65536
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable zoka-rpc
          chmod 0755 /usr/local/bin/zoka-sync-watchdog.sh
          systemctl enable --now zoka-sync-watchdog.timer
          systemctl stop zoka-rpc 2>/dev/null || true
          systemctl start zoka-rpc
          sleep 8
          systemctl status zoka-rpc --no-pager -l
          REMOTE

      - name: Show RPC logs
        run: |
          ssh -i ~/.ssh/zoka_do root@${{ env.RPC_IP }} \
            "journalctl -u zoka-rpc -n 50 --no-pager"
