name: Deploy Mainnet Nodes

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target node to deploy'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - bootstrap
          - rpc

env:
  BOOTSTRAP_IP: "159.223.119.216"
  RPC_IP: "157.230.5.103"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Linux x86_64 binary
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install RandomX build deps
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential pkg-config

      - name: Build release binary
        run: cargo build --release --bin zoka

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: zoka-linux-x86_64
          path: target/release/zoka
          retention-days: 7

  deploy-bootstrap:
    name: Deploy bootstrap node
    needs: build
    runs-on: ubuntu-22.04
    if: ${{ inputs.target == 'both' || inputs.target == 'bootstrap' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: zoka-linux-x86_64
          path: ./bin/

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_PRIVATE_KEY }}" > ~/.ssh/zoka_do
          chmod 600 ~/.ssh/zoka_do
          ssh-keyscan -H ${{ env.BOOTSTRAP_IP }} >> ~/.ssh/known_hosts

      - name: Upload binary
        run: |
          chmod +x ./bin/zoka
          scp -i ~/.ssh/zoka_do ./bin/zoka root@${{ env.BOOTSTRAP_IP }}:/tmp/zoka-new
          ssh -i ~/.ssh/zoka_do root@${{ env.BOOTSTRAP_IP }} "chmod +x /tmp/zoka-new && mv /tmp/zoka-new /usr/local/bin/zoka"

      - name: Upload trusted-setup
        run: |
          ssh -i ~/.ssh/zoka_do root@${{ env.BOOTSTRAP_IP }} "mkdir -p /opt/zoka/trusted-setup"
          scp -i ~/.ssh/zoka_do trusted-setup/* root@${{ env.BOOTSTRAP_IP }}:/opt/zoka/trusted-setup/

      - name: Upload network config
        run: |
          scp -i ~/.ssh/zoka_do docs/mainnet-network.v1.json root@${{ env.BOOTSTRAP_IP }}:/opt/zoka/mainnet-network.v1.json

      - name: Upload watchdog script
        run: |
          scp -i ~/.ssh/zoka_do scripts/zoka-sync-watchdog.sh root@${{ env.BOOTSTRAP_IP }}:/usr/local/bin/zoka-sync-watchdog.sh
          ssh -i ~/.ssh/zoka_do root@${{ env.BOOTSTRAP_IP }} "chmod +x /usr/local/bin/zoka-sync-watchdog.sh"

      - name: Install systemd service and start
        run: |
          ssh -i ~/.ssh/zoka_do root@${{ env.BOOTSTRAP_IP }} bash -s << 'REMOTE'
          set -e
          mkdir -p /data/zoka
          if command -v ufw >/dev/null 2>&1; then
            ufw allow 28080/tcp comment 'ZOKA public P2P' || true
            ufw reload || true
          fi

          # Stop and disable legacy service names if present
          systemctl stop zoka-bootstrap 2>/dev/null || true
          systemctl disable zoka-bootstrap 2>/dev/null || true
          systemctl stop zoka-rpc 2>/dev/null || true
          systemctl disable zoka-rpc 2>/dev/null || true

          cat > /etc/systemd/system/zoka-node.service << 'EOF'
          [Unit]
          Description=Zoka Node — Zenith mainnet seed/bootstrap
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=root
          WorkingDirectory=/data/zoka
          ExecStart=/usr/local/bin/zoka fullnode \
            --network mainnet \
            --network-config /opt/zoka/mainnet-network.v1.json \
            --db /data/zoka/blockchain.db \
            --listen /ip4/0.0.0.0/tcp/28080 \
            --no-mine \
            --mine-interval-secs 30 \
            --mine-blocks 1 \
            --min-mine-peers 0 \
            --sync-warmup-secs 10 \
            --sync-rebroadcast-recent-blocks 32 \
            --allow-isolated-start \
            --password-env ZOKA_NODE_PASSWORD
          Environment=RUST_LOG=info
          Environment=ZOKA_HOME=/data/zoka
          Environment=ZOKA_TRUSTED_SETUP_DIR=/opt/zoka/trusted-setup
          Environment=ZOKA_API_BIND=0.0.0.0:3000
          Environment=ZOKA_API_RATE_LIMIT=180
          Environment=ZOKA_API_READ_RATE_LIMIT=5000
          Environment=ZOKA_API_TX_RATE_LIMIT=120
          Environment=ZOKA_API_MAX_BODY_BYTES=1048576
          Environment=ZOKA_API_ENABLE_BLOCK_SUBMIT=true
          Environment=ZOKA_MINER_ADDRESS=zka1a6n1R8noF6T5vR4YGGv8ibUKpUESu8y5ESdb8BUNx6wGengyZ9mXGJA7u9dpwUh5rxk3gSFXEhBZacXgHUNjb5ET3cJn9
          Environment=ZOKA_NODE_PASSWORD=${{ secrets.ZOKA_NODE_PASSWORD }}
          Restart=on-failure
          RestartSec=10s
          LimitNOFILE=65536
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable zoka-node
          systemctl stop zoka-node 2>/dev/null || true
          if [ -d /data/zoka/blockchain.db ]; then
            tar -C /data/zoka -czf "/data/zoka/blockchain.db.pre-1.5.0.$(date -u +%Y%m%d%H%M%S).tgz" blockchain.db
          fi
          /usr/local/bin/zoka chain-economics-migrate \
            --network mainnet \
            --db /data/zoka/blockchain.db \
            --yes \
            --json
          systemctl start zoka-node
          sleep 8
          systemctl status zoka-node --no-pager -l
          REMOTE

      - name: Show bootstrap logs
        run: |
          ssh -i ~/.ssh/zoka_do root@${{ env.BOOTSTRAP_IP }} \
            "journalctl -u zoka-node -n 50 --no-pager"

  deploy-rpc:
    name: Deploy RPC node
    needs: [build]
    runs-on: ubuntu-22.04
    if: ${{ inputs.target == 'both' || inputs.target == 'rpc' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: zoka-linux-x86_64
          path: ./bin/

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_PRIVATE_KEY }}" > ~/.ssh/zoka_do
          chmod 600 ~/.ssh/zoka_do
          ssh-keyscan -H ${{ env.RPC_IP }} >> ~/.ssh/known_hosts

      - name: Upload binary
        run: |
          chmod +x ./bin/zoka
          scp -i ~/.ssh/zoka_do ./bin/zoka root@${{ env.RPC_IP }}:/tmp/zoka-new
          ssh -i ~/.ssh/zoka_do root@${{ env.RPC_IP }} "chmod +x /tmp/zoka-new && mv /tmp/zoka-new /usr/local/bin/zoka"

      - name: Upload trusted-setup
        run: |
          ssh -i ~/.ssh/zoka_do root@${{ env.RPC_IP }} "mkdir -p /opt/zoka/trusted-setup"
          scp -i ~/.ssh/zoka_do trusted-setup/* root@${{ env.RPC_IP }}:/opt/zoka/trusted-setup/

      - name: Upload network config
        run: |
          scp -i ~/.ssh/zoka_do docs/mainnet-network.v1.json root@${{ env.RPC_IP }}:/opt/zoka/mainnet-network.v1.json

      - name: Upload watchdog script
        run: |
          scp -i ~/.ssh/zoka_do scripts/zoka-sync-watchdog.sh root@${{ env.RPC_IP }}:/usr/local/bin/zoka-sync-watchdog.sh
          ssh -i ~/.ssh/zoka_do root@${{ env.RPC_IP }} "chmod +x /usr/local/bin/zoka-sync-watchdog.sh"

      - name: Install systemd service and start
        run: |
          ssh -i ~/.ssh/zoka_do root@${{ env.RPC_IP }} bash -s << 'REMOTE'
          set -e
          mkdir -p /data/zoka
          if command -v ufw >/dev/null 2>&1; then
            ufw allow 28080/tcp comment 'ZOKA public P2P' || true
            ufw reload || true
          fi

          # Stop and disable legacy service names if present
          systemctl stop zoka-bootstrap 2>/dev/null || true
          systemctl disable zoka-bootstrap 2>/dev/null || true
          systemctl stop zoka-rpc 2>/dev/null || true
          systemctl disable zoka-rpc 2>/dev/null || true

          cat > /etc/systemd/system/zoka-node.service << 'EOF'
          [Unit]
          Description=Zoka Node — Zenith mainnet RPC/full
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=root
          WorkingDirectory=/data/zoka
          ExecStart=/usr/local/bin/zoka fullnode \
            --network mainnet \
            --network-config /opt/zoka/mainnet-network.v1.json \
            --db /data/zoka/blockchain.db \
            --listen /ip4/0.0.0.0/tcp/28080 \
            --no-mine \
            --sync-warmup-secs 30 \
            --sync-rebroadcast-recent-blocks 32 \
            --allow-isolated-start \
            --password-env ZOKA_NODE_PASSWORD
          Environment=RUST_LOG=info
          Environment=ZOKA_HOME=/data/zoka
          Environment=ZOKA_TRUSTED_SETUP_DIR=/opt/zoka/trusted-setup
          Environment=ZOKA_API_BIND=0.0.0.0:3000
          Environment=ZOKA_API_RATE_LIMIT=180
          Environment=ZOKA_API_READ_RATE_LIMIT=5000
          Environment=ZOKA_API_TX_RATE_LIMIT=120
          Environment=ZOKA_API_MAX_BODY_BYTES=1048576
          Environment=ZOKA_API_ENABLE_BLOCK_SUBMIT=true
          Environment=ZOKA_NODE_PASSWORD=${{ secrets.ZOKA_NODE_PASSWORD }}
          Restart=on-failure
          RestartSec=10s
          LimitNOFILE=65536
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
          EOF

          # Install watchdog timer
          cat > /etc/systemd/system/zoka-sync-watchdog.service << 'EOF'
          [Unit]
          Description=Zoka node sync catch-up watchdog
          After=network-online.target zoka-node.service
          Wants=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/zoka-sync-watchdog.sh
          Environment=BOOT_RPC=http://159.223.119.216:3000,http://157.230.5.103:3000
          Environment=LOCAL_RPC=http://127.0.0.1:3000
          Environment=GAP_THRESHOLD=2
          Environment=MAX_PUSH=64
          Environment=CURL_TIMEOUT=30
          EOF

          cat > /etc/systemd/system/zoka-sync-watchdog.timer << 'EOF'
          [Unit]
          Description=Run Zoka node sync catch-up watchdog every 30 seconds

          [Timer]
          OnBootSec=20s
          OnUnitActiveSec=30s
          AccuracySec=5s
          Persistent=true

          [Install]
          WantedBy=timers.target
          EOF

          systemctl daemon-reload
          systemctl enable zoka-node
          systemctl enable zoka-sync-watchdog.timer
          systemctl stop zoka-node 2>/dev/null || true
          if [ -d /data/zoka/blockchain.db ]; then
            tar -C /data/zoka -czf "/data/zoka/blockchain.db.pre-1.5.0.$(date -u +%Y%m%d%H%M%S).tgz" blockchain.db
          fi
          /usr/local/bin/zoka chain-economics-migrate \
            --network mainnet \
            --db /data/zoka/blockchain.db \
            --yes \
            --json
          systemctl start zoka-node
          systemctl start zoka-sync-watchdog.timer
          sleep 8
          systemctl status zoka-node --no-pager -l
          REMOTE

      - name: Show RPC logs
        run: |
          ssh -i ~/.ssh/zoka_do root@${{ env.RPC_IP }} \
            "journalctl -u zoka-node -n 50 --no-pager"
